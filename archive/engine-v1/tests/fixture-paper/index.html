<!doctype html><meta charset="utf-8" />
<body style="margin:0">
  <script type="module">
    import { createStage } from "../../core/lib/stage.js";
    import { clipping } from "../../styles/vox/lib/paper.js";
    import * as K from "../../styles/vox/lib/kit.js";
    const stage = await createStage({
      dur: 6,
      images: {
        a: "../.assets/portrait-1.png",
        b: "../.assets/portrait-2.png",
      },
    });
    const A = clipping(stage, {
      img: stage.img.a,
      w: 400,
      x: 540,
      y: 900,
      z: 2,
      seed: 3,
      moves: [
        { kind: "slap", at: 0.5 },
        { kind: "fold", at: 2, to: 0.5 },
        { kind: "crumple", at: 3 },
      ],
    });
    const B = clipping(stage, {
      img: stage.img.b,
      w: 400,
      x: 600,
      y: 950,
      z: 1,
      seed: 5,
      moves: [{ kind: "slideUnder", at: 0.2, from: [700, 0], under: 2 }],
    });
    // C: a page with a reverse, turned over at 1 s; D/E/H: edge and halftone variants.
    const C = clipping(stage, {
      img: stage.img.a,
      back: stage.img.b,
      w: 300,
      x: 200,
      y: 300,
      edge: "straight",
      boil: false,
      moves: [{ kind: "slap", at: 0.1 }, { kind: "flip", at: 1 }],
    });
    const D = clipping(stage, { img: stage.img.a, w: 200, x: 700, y: 300, edge: "baked", moves: [{ kind: "slap", at: 0.1 }] });
    const H = clipping(stage, { img: stage.img.a, w: 200, x: 900, y: 300, halftone: true, moves: [{ kind: "slap", at: 0.1 }] });
    window.STAGE = stage;
    window.clipping = clipping;
    window.K = K;
    window.PAPER = { A, B, C, D, H };
    window.CUES = [...A.cues(), ...B.cues()];
    stage.run((t) => {
      A.draw(t);
      B.draw(t);
      C.draw(t);
      D.draw(t);
      H.draw(t);
    });
  </script>
</body>
