<!doctype html><meta charset="utf-8" />
<body style="margin:0">
  <script type="module">
    import { createStage } from "../../core/lib/stage.js";
    import { clipping } from "../../styles/vox/lib/paper.js";
    const stage = await createStage({
      dur: 6,
      images: {
        a: "../.assets/portrait-1.png",
        b: "../.assets/portrait-2.png",
      },
    });
    const A = clipping(stage, {
      img: stage.img.a,
      w: 400,
      x: 540,
      y: 900,
      z: 2,
      seed: 3,
      moves: [
        { kind: "slap", at: 0.5 },
        { kind: "fold", at: 2, to: 0.5 },
        { kind: "crumple", at: 3 },
      ],
    });
    const B = clipping(stage, {
      img: stage.img.b,
      w: 400,
      x: 600,
      y: 950,
      z: 1,
      seed: 5,
      moves: [{ kind: "slideUnder", at: 0.2, from: [700, 0], under: 2 }],
    });
    window.PAPER = { A, B };
    window.CUES = [...A.cues(), ...B.cues()];
    stage.run((t) => {
      A.draw(t);
      B.draw(t);
    });
  </script>
</body>
